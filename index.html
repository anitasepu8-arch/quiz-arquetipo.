<title>Tu Arquetipo de Marca</title>

<style>
/* Layout: app de una columna, cabecera fija con progreso segmentado; cada paso es una pantalla; el resultado cierra con el mapa de 8 ejes (diseño vs. respuestas) */
:root{
  --tinto:#0E0506;
  --tinto-2:#170809;
  --borgona:#4E0000;
  --borgona-2:#7A1A1A;
  --oro:#D4AF78;
  --oro-claro:#E9D3A8;
  --crema:#F5F1E8;
  --crema-2:#BFB3A6;
  --turquesa:#35C9C1;
  --linea:rgba(212,175,120,.22);
  --display:"Montserrat", "Helvetica Neue", Arial, sans-serif;
  --body:"Poppins", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--tinto);color:var(--crema);font-family:var(--body);font-size:16px;line-height:1.6;font-weight:300;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(90% 55% at 100% 0%, rgba(122,26,26,.55), transparent 70%), radial-gradient(70% 45% at 0% 100%, rgba(78,0,0,.6), transparent 70%);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--tinto)}

.cab{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(14,5,6,.88);backdrop-filter:blur(10px);
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right,0px)));
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));border-bottom:1px solid var(--linea)}
.cab-in{max-width:560px;margin:0 auto;padding-block:14px;display:flex;flex-direction:column;gap:10px}
.cab-fila{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.28em;color:var(--crema)}
.logo span{color:var(--oro)}
.cuenta{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--oro);font-variant-numeric:tabular-nums}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:3px;border-radius:2px;background:rgba(245,241,232,.12);transition:background .35s}
.segs i.on{background:var(--oro)}
.segs i.now{background:linear-gradient(90deg,var(--oro),var(--turquesa))}

main{max-width:560px;margin:0 auto;padding-block:36px 64px}
.pantalla{display:flex;flex-direction:column;gap:24px;animation:entra .5s cubic-bezier(.2,.7,.2,1)}
@keyframes entra{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}

.kicker{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--turquesa)}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.05}
h1{font-size:clamp(32px,8.6vw,50px);text-transform:uppercase}
h1 em,h2 em{font-style:normal;color:var(--oro)}
h2{font-size:clamp(26px,6.6vw,34px)}
.lead{margin:0;color:var(--crema-2);font-size:16px;max-width:52ch}
.lead strong{color:var(--crema);font-weight:500}

/* Bienvenida */
.hero{display:grid;gap:26px}
.sello{width:100%;max-width:180px;justify-self:center;aspect-ratio:1}
.sello svg{width:100%;height:100%;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:500;letter-spacing:.04em;padding:6px 12px;border-radius:999px;border:1px solid var(--linea);color:var(--crema-2)}

/* Opciones */
.opciones{display:grid;gap:10px}
.opciones.doble{grid-template-columns:1fr 1fr}
@media (max-width:440px){.opciones.doble{grid-template-columns:1fr}}
.op{font:inherit;font-size:16px;font-weight:400;color:var(--crema);text-align:left;cursor:pointer;
  display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:14px;
  background:linear-gradient(180deg,rgba(245,241,232,.05),rgba(245,241,232,.02));border:1px solid var(--linea);
  transition:border-color .2s, background .2s, transform .15s}
.op .letra{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:14px;color:var(--oro);border:1px solid var(--linea);transition:all .2s}
.op:hover{border-color:var(--oro);background:rgba(212,175,120,.07)}
.op:hover .letra{background:var(--oro);color:var(--tinto);border-color:var(--oro)}
.op:active{transform:scale(.985)}
.op[aria-pressed="true"]{background:linear-gradient(135deg,var(--borgona),var(--borgona-2));border-color:var(--oro)}
.op[aria-pressed="true"] .letra{background:var(--oro);color:var(--tinto)}
.op.frase{font-family:var(--display);font-weight:600;font-size:15px;min-height:72px}

/* Botones */
.acciones{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
  border:0;border-radius:999px;padding:18px 30px;background:var(--oro);color:var(--tinto);text-decoration:none;text-align:center;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background .2s, transform .15s;box-shadow:0 10px 30px -12px rgba(212,175,120,.6)}
.btn:hover{background:var(--oro-claro)}
.btn:active{transform:scale(.98)}
.btn.full{width:100%}
.btn.sec{background:transparent;color:var(--crema-2);box-shadow:none;border:1px solid var(--linea);font-weight:600}
.btn.sec:hover{color:var(--crema);border-color:var(--oro)}
.volver{font:inherit;font-size:13px;color:var(--crema-2);background:none;border:0;cursor:pointer;padding:4px 0;align-self:flex-start;letter-spacing:.04em}
.volver:hover{color:var(--oro)}
.op:focus-visible,.btn:focus-visible,.volver:focus-visible,input:focus-visible{outline:2px solid var(--turquesa);outline-offset:3px}

/* Formularios */
.campos{display:flex;flex-direction:column;gap:18px}
label{display:flex;flex-direction:column;gap:8px;font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro)}
label small{font-family:var(--body);font-weight:300;font-size:13px;letter-spacing:0;text-transform:none;color:var(--crema-2)}
input{font:inherit;font-size:17px;font-weight:400;color:var(--crema);background:rgba(245,241,232,.05);border:1px solid var(--linea);border-radius:12px;padding:14px 16px;width:100%;min-width:0}
input::placeholder{color:rgba(191,179,166,.55)}
input::-webkit-calendar-picker-indicator{filter:invert(.8) sepia(.4)}
.fila{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
@media (max-width:440px){.fila{grid-template-columns:1fr}}
.opcional{border-top:1px dashed var(--linea);padding-top:18px;display:flex;flex-direction:column;gap:12px}
.error{margin:0;font-size:14px;color:#F3A7A7}

/* Cálculo */
.calc{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.calc .sello{max-width:200px}

/* Resultado */
.ficha{position:relative;overflow:hidden;border-radius:20px;padding:30px 24px 28px;display:flex;flex-direction:column;gap:14px;
  background:linear-gradient(150deg,var(--borgona-2) 0%,var(--borgona) 45%,#2A0204 100%);border:1px solid rgba(212,175,120,.45)}
.ficha::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(212,175,120,.25);box-shadow:0 0 0 30px rgba(212,175,120,.05)}
.ficha .rot{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--oro-claro)}
.ficha .nombre{font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,48px);line-height:1;text-transform:uppercase;color:var(--crema);text-wrap:balance;letter-spacing:-.01em}
.ficha .ejes{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--oro)}
.ficha p{margin:0;color:var(--crema);max-width:44ch;position:relative;z-index:1}
.revelar{animation:revela 1s cubic-bezier(.2,.7,.2,1)}
@keyframes revela{from{opacity:.0;letter-spacing:.2em;filter:blur(6px)}to{opacity:1}}

.pantalla.r4{padding-bottom:88px}
.pantalla.r4>*{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.pantalla.r4>*.en-vista{opacity:1;transform:none}
.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(14,5,6,0) 0%,rgba(14,5,6,.94) 32%,rgba(14,5,6,.98) 100%)}
.sticky-cta .btn{max-width:480px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.5)}

.comparar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lado{padding:16px;border-radius:14px;border:1px solid var(--linea);display:flex;flex-direction:column;gap:6px;min-width:0}
.lado .r{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.22em;text-transform:uppercase}
.lado .n{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.15}
.lado.real .r{color:var(--oro)} .lado.real{background:rgba(212,175,120,.06)}
.lado.perc .r{color:var(--turquesa)}

.mapa{border:1px solid var(--linea);border-radius:18px;padding:20px 12px 14px;display:flex;flex-direction:column;gap:6px;background:rgba(245,241,232,.02)}
.mapa h3{font-size:13px;letter-spacing:.2em;text-transform:uppercase;text-align:center;color:var(--crema)}
.mapa svg{width:100%;height:auto;display:block}
.leyenda{display:flex;justify-content:center;gap:18px;font-size:12px;color:var(--crema-2);flex-wrap:wrap}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:14px;height:3px;border-radius:2px;display:inline-block}

.brecha{display:flex;flex-direction:column;gap:12px}
.brecha p{margin:0}
.brecha b{font-weight:600;color:var(--oro)}
.alerta{padding:18px;border-radius:14px;background:rgba(53,201,193,.07);border:1px solid rgba(53,201,193,.35);color:var(--crema)}
.alerta b{color:var(--turquesa)}
.cierre{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.3;margin:0;color:var(--crema);text-wrap:balance}
.nota{margin:0;font-size:13px;color:var(--crema-2)}
.cta{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.ok{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,40px);text-transform:uppercase;line-height:1.05}
.ok em{font-style:normal;color:var(--oro)}

@keyframes gira{to{transform:rotate(360deg)}}

/* ===== v3: curiosidad, revelación por capas, ofertas, tarjeta ===== */
.candado{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--crema-2)}
.candado .lbl{font-family:var(--display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:10px;color:var(--oro);white-space:nowrap}
.borroso{filter:blur(7px);user-select:none;-webkit-user-select:none;pointer-events:none;font-family:var(--display);font-weight:800;text-transform:uppercase;color:var(--crema);letter-spacing:.02em}
.candado .borroso{filter:blur(5px);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:clip;min-width:0}
.ico{flex:none;width:14px;height:14px}

.teaser{display:flex;flex-direction:column;gap:22px}
.caja-oculta{position:relative;border-radius:20px;padding:34px 22px;text-align:center;overflow:hidden;
  background:linear-gradient(150deg,var(--borgona-2),var(--borgona) 55%,#2A0204);border:1px solid rgba(212,175,120,.45);display:flex;flex-direction:column;gap:14px;align-items:center}
.caja-oculta .borroso{font-size:clamp(30px,8vw,42px);line-height:1.05}
.caja-oculta .rot{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--oro-claro)}
.caja-oculta .sello-mini{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--tinto);border:1px solid var(--oro)}

.capa{min-height:62vh;justify-content:center}
.gran-nombre{font-family:var(--display);font-weight:800;font-size:clamp(44px,13vw,72px);line-height:.95;text-transform:uppercase;color:var(--crema);text-wrap:balance;letter-spacing:-.02em}
.gran-nombre em{font-style:normal;color:var(--oro)}
.veredicto{display:inline-flex;align-self:flex-start;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.veredicto.si{background:rgba(212,175,120,.15);color:var(--oro);border:1px solid var(--oro)}
.veredicto.no{background:rgba(53,201,193,.1);color:var(--turquesa);border:1px solid var(--turquesa)}
.esencia{font-family:var(--display);font-weight:600;font-size:clamp(22px,5.6vw,28px);line-height:1.3;color:var(--crema);margin:0;text-wrap:balance}
.gancho{font-family:var(--display);font-weight:800;font-size:clamp(24px,6.4vw,32px);line-height:1.15;margin:0;text-wrap:balance}
.gancho em{font-style:normal;color:var(--oro)}

.ofertas{display:flex;flex-direction:column;gap:14px}
.oferta{position:relative;border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--linea);background:rgba(245,241,232,.03)}
.oferta.reco{border:1.5px solid var(--oro);background:linear-gradient(160deg,rgba(122,26,26,.55),rgba(78,0,0,.35))}
.oferta .badge{position:absolute;top:-11px;left:18px;background:var(--oro);color:var(--tinto);font-family:var(--display);font-weight:800;font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.oferta .cab-of{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.oferta h3{font-size:19px;line-height:1.15}
.precio{font-family:var(--display);font-weight:800;font-size:26px;color:var(--oro);font-variant-numeric:tabular-nums;white-space:nowrap}
.precio small{font-size:12px;font-weight:600;color:var(--crema-2);letter-spacing:.1em;margin-right:4px}
.oferta p{margin:0;color:var(--crema-2);font-size:15px}
.oferta ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.oferta li{display:flex;gap:10px;align-items:baseline}
.oferta li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--oro);transform:translateY(-2px)}
.oferta li.fuera{color:rgba(191,179,166,.6)}
.oferta li.fuera::before{background:transparent;border:1px solid rgba(191,179,166,.5)}
.alineacion,.bloqueos,.costo{border:1px solid var(--linea);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:16px;background:rgba(245,241,232,.02)}
.alineacion h3,.bloqueos h3,.costo h3{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--crema)}
.nivel{display:flex;flex-direction:column;gap:8px}
.nivel-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px}
.nivel-top>span:first-child{min-width:0;overflow-wrap:anywhere}
.pct{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.seg10{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.seg10 i{height:8px;border-radius:2px;background:rgba(245,241,232,.1)}
.seg10 i.on{background:var(--oro)}
.niv{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.al{color:var(--turquesa)} .par{color:var(--oro)} .des{color:#F08A8A}
.nivel:has(.des) .seg10 i.on{background:#C94A4A}
.nivel:has(.al) .seg10 i.on{background:var(--turquesa)}
.bloq{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(122,26,26,.35);border:1px solid rgba(212,175,120,.25)}
.bloq>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.bloq .b-t{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro)}
.bloq b{color:var(--crema);font-weight:600}
.bloq .borroso{font-size:15px}
.costo{border-color:rgba(240,138,138,.45);background:rgba(122,26,26,.22)}
.costo h3{color:#F3B0B0}
.costo ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.costo li{display:flex;gap:12px;align-items:baseline;font-size:15px;line-height:1.5}
.costo li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:#F08A8A;transform:translateY(-2px)}
.incluye{color:var(--crema)!important;font-size:14px!important}
.incluye-mini{display:flex;flex-direction:column;gap:14px;border:1px solid var(--linea);border-radius:18px;padding:20px 18px;background:rgba(245,241,232,.02)}
.incluye-mini h3{font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.incluye-mini .item{display:flex;gap:14px;align-items:flex-start}
.incluye-mini .num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--oro);color:var(--tinto);font-family:var(--display);font-weight:800;font-size:13px}
.incluye-mini .item>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.incluye-mini b{font-family:var(--display);font-weight:700;font-size:16px}
.incluye-mini .item>div span{color:var(--crema-2);font-size:14px}
.precio-mini{display:flex;flex-direction:column;gap:12px;border:1.5px solid var(--oro);border-radius:18px;padding:22px 20px;background:linear-gradient(160deg,rgba(122,26,26,.55),rgba(78,0,0,.35))}
.precio-mini .ancla{display:flex;justify-content:space-between;gap:12px;color:var(--crema-2);font-size:14px}
.precio-mini .p152{font-family:var(--display);font-weight:700}
.precio-mini .hoy{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.precio-mini .hoy b{font-family:var(--display);font-weight:800;font-size:34px;color:var(--oro)}
.faq{display:flex;flex-direction:column;gap:8px}
.faq details{border:1px solid var(--linea);border-radius:12px;padding:14px 16px}
.faq summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:15px;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";float:right;color:var(--oro)}
.faq details[open] summary::after{content:"–"}
.faq p{margin:10px 0 0;color:var(--crema-2);font-size:14px}
.presentacion{border:1px solid var(--linea);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;background:rgba(245,241,232,.02)}
.presentacion h3{font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.presentacion p{margin:0;font-size:15px}
.presentacion b{color:var(--oro);font-weight:600}
.presentacion .cita{font-family:var(--display);font-weight:700;font-size:20px;color:var(--crema);overflow-wrap:anywhere}

.tarjeta{width:100%;max-width:320px;aspect-ratio:9/16;align-self:center;border-radius:14px;overflow:hidden;position:relative;

.tarjeta .t-bg{position:absolute;left:0;right:0;top:0;height:63%;background-size:cover;background-position:center 0%;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 72%,rgba(0,0,0,.5) 86%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,#000 72%,rgba(0,0,0,.5) 86%,transparent 100%)}

  -webkit-mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.6) 25%,rgba(0,0,0,.3) 65%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.6) 25%,rgba(0,0,0,.3) 65%,transparent 100%)}
.tarjeta::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(14,5,6,.85) 0%,rgba(14,5,6,.55) 9%,rgba(14,5,6,0) 17%)}

function reducir(n){ while(n>9 && n!==11 && n!==22 && n!==33){ n=String(n).split("").reduce((a,d)=>a+Number(d),0);} return n; }
function caminoDeVida(d,m,a){ const s=(String(d).padStart(2,"0")+String(m).padStart(2,"0")+String(a)).split("").reduce((x,c)=>x+Number(c),0); const r=reducir(s); return r===2?11:r; } /* GG33: no existe el Camino de Vida 2 */
function ejesDelDia(d){ if(DIAS_ESPECIALES[d]) return DIAS_ESPECIALES[d]; return NUM_EJES[reducir(d)]; }
function animalChino(d,m,a){
  let anio=a;
  if(m<=2){
    const anl = ANL[a];
    if(anl){ if(m<anl[0] || (m===anl[0] && d<anl[1])) anio=a-1; }
    else if(m===1 || (m===2 && d<4)) anio=a-1; /* fuera de tabla: regla general */
  }
  return ANIMALES[((anio-4)%12+12)%12];
}
function claveTop2(puntos){
  const orden=[...ORDEN].sort((x,y)=> (puntos[y]-puntos[x]) || (ORDEN.indexOf(x)-ORDEN.indexOf(y)));
  const top=[orden[0],orden[1]].sort((x,y)=>ORDEN.indexOf(x)-ORDEN.indexOf(y));
  return top.join("+");
}
/* Año chino (empieza en su Año Nuevo real), animal y elemento */
function anioChino(d,m,a){ const anl=ANL[a]; if(anl && (m<anl[0] || (m===anl[0] && d<anl[1]))) return a-1; return a; }
const ELEMENTOS=["Madera","Madera","Fuego","Fuego","Tierra","Tierra","Metal","Metal","Agua","Agua"];
function animalCompleto(d,m,a){
  const y=anioChino(d,m,a);
  return {animal: ANIMALES[((y-4)%12+12)%12], elemento: ELEMENTOS[((y-4)%10+10)%10], anio:y, inicio: ANL[y]};
}
function arquetipoReal(d,m,a){
  /* 1º eje = primer eje del Camino de Vida. 2º eje = donde coinciden día y animal (1 punto cada cualidad), sin repetir el 1º.
     Desempate: primer eje del animal, luego su segundo, luego el orden del día. */
  const principal=NUM_EJES[caminoDeVida(d,m,a)][0];
  const dia=ejesDelDia(d), ani=ANI_EJES[animalChino(d,m,a)];
  const p=Object.fromEntries(ORDEN.map(e=>[e,0])); dia.forEach(e=>p[e]++); ani.forEach(e=>p[e]++);
  const clave=e=>[p[e], e===ani[0]?2:(ani.includes(e)?1:0), e===dia[0]?2:(dia.includes(e)?1:0)];
  let mejor=null;
  for(const e of ORDEN){ if(e===principal) continue; if(!mejor){mejor=e;continue;} const a1=clave(e), b1=clave(mejor); for(let k=0;k<3;k++){ if(a1[k]!==b1[k]){ if(a1[k]>b1[k]) mejor=e; break; } } }
  return [principal,mejor].sort((x,y)=>ORDEN.indexOf(x)-ORDEN.indexOf(y)).join("+");
}
function arquetipoPercibido(ejes){
  const p=Object.fromEntries(ORDEN.map(e=>[e,0]));
  ejes.forEach(e=>p[e]+=1);
  return claveTop2(p);
}

function semilla(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }

/* Sello: octógono de los 8 ejes */
function selloSVG(){
  const c=150, r=112, pts=[];
  for(let i=0;i<8;i++){ const a=-Math.PI/2+i*Math.PI/4; pts.push([c+r*Math.cos(a), c+r*Math.sin(a)]); }
  const f=n=>n.toFixed(1);
  const poly=pts.map(p=>f(p[0])+","+f(p[1])).join(" ");
  const ln=(p,q,o)=>`<line x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}" stroke="rgba(212,175,120,${o})" stroke-width="1"/>`;
  return `<svg viewBox="0 0 300 300" role="img" aria-label="Los 8 ejes de marca">
    <g style="transform-origin:150px 150px;animation:gira 60s linear infinite"><circle cx="150" cy="150" r="138" fill="none" stroke="rgba(212,175,120,.18)" stroke-dasharray="2 6"/></g>
    <polygon points="${poly}" fill="rgba(122,26,26,.35)" stroke="#D4AF78" stroke-width="1.2"/>
    ${pts.map((p,i)=>ln(p,pts[(i+3)%8],.16)).join("")}${[0,1,2,3].map(k=>ln(pts[k],pts[k+4],.35)).join("")}${pts.map(p=>ln([c,c],p,.22)).join("")}
    <circle cx="150" cy="150" r="26" fill="#0E0506" stroke="#D4AF78"/><circle cx="150" cy="150" r="6" fill="#D4AF78"/>
    ${pts.map((p,i)=>`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${i%2?3:4.5}" fill="${i%2?'#35C9C1':'#D4AF78'}"/>`).join("")}
  </svg>`;
}

/* Mapa de 8 ejes: diseño (oro) vs. respuestas (turquesa) */
function mapaSVG(pR,pP){
  const c=180, r=110, n=8;
  const mR=Math.max(...Object.values(pR))||1, mP=Math.max(...Object.values(pP))||1;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const xy=(i,v)=>[c+r*v*Math.cos(ang(i)), c+r*v*Math.sin(ang(i))];
  const pol=(p,m)=>ORDEN.map((e,i)=>xy(i,0.12+0.88*p[e]/m).map(x=>x.toFixed(1)).join(",")).join(" ");
  let g="";
  [0.25,0.5,0.75,1].forEach(k=>{ g+=`<polygon points="${ORDEN.map((_,i)=>xy(i,k).map(x=>x.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="rgba(245,241,232,.1)"/>`; });
  ORDEN.forEach((_,i)=>{ const [x,y]=xy(i,1); g+=`<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(245,241,232,.08)"/>`; });
  const top=S.real.split("+");
  const et=ORDEN.map((e,i)=>{ const [x,y]=xy(i,1.2); const cs=Math.cos(ang(i)), sn=Math.sin(ang(i));
    const an=Math.abs(cs)<.2?"middle":(cs>0?"start":"end"); const dy=sn>.5?12:(sn<-.5?-4:4); const on=top.includes(e);
    return `<text x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${an}" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="${on?800:500}" fill="${on?'#D4AF78':'#BFB3A6'}">${e.toUpperCase()}</text>`; }).join("");
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 440 370" role="img" aria-label="Tus 8 ejes: diseño frente a respuestas">${g}
    <polygon points="${pol(pR,mR)}" fill="rgba(212,175,120,.28)" stroke="#D4AF78" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="${pol(pP,mP)}" fill="none" stroke="#35C9C1" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>${et}</svg>`;
}

function opcionesApuesta(){
  if(S.opcApuesta) return S.opcApuesta;
  const set=[S.real]; if(S.perc!==S.real) set.push(S.perc);
  const claves=Object.keys(BANCO).filter(k=>!set.includes(k));
  let h=semilla(S.nombre+S.d+S.m+S.a);

}

function revelarR4(){
  const sec=app.querySelector(".pantalla.r4"); if(!sec) return;
  const els=[...sec.children];
  if(!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("en-vista")); return; }
  const io=new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("en-vista"); io.unobserve(en.target); } });
  },{threshold:.12, rootMargin:"0px 0px -6% 0px"});
  els.forEach(e=>io.observe(e));
}

function bloqueoMini(){
  const [a,b]=S.real.split("+"), fuera=e=>e!==a&&e!==b, orden=(x,y)=>(S.pReal[y]-S.pReal[x])||(ORDEN.indexOf(x)-ORDEN.indexOf(y));
  return bloqueos().find(fuera)
    || ORDEN.filter(e=>fuera(e)&&!S.esc.includes(e)).sort(orden)[0]
    || ORDEN.filter(fuera).sort(orden)[0];
}
function refMini(){
  if(!S.real||!S.d||!S.m||!S.a) return "";

  const bl=bloqueoMini();

  const nSp=Math.min(8,Math.max(1,ORDEN.filter(e=>S.pReal&&S.pReal[e]>0).length));
  const nBl=Math.min(8,Math.max(1,new Set([bl,...bloqueos()]).size));
  const dec=S.decision==="si"?"s":(S.decision==="no"?"n":"x");

function cargarImagen(src){
  return new Promise((resolve,reject)=>{ const im=new Image(); im.crossOrigin="anonymous"; im.onload=()=>resolve(im); im.onerror=reject; im.src=src; });
}
async function dibujarTarjetaCanvas(){
  const nom=S.real?BANCO[S.real][0]:"", ese=S.real?BANCO[S.real][1]:"";
  const zodiaco=(S.d&&S.m&&S.a)?animalCompleto(+S.d,+S.m,+S.a):null;
  const W=1080,H=1920;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const ctx=cv.getContext("2d");
  ctx.fillStyle="#0E0506"; ctx.fillRect(0,0,W,H);
  // fondo: ilustración del animal chino, cubriendo ~63% superior, con degradado hacia transparente
  const bgH=Math.round(H*.63);
  if(zodiaco && ANIMAL_IMG[zodiaco.animal]){
    try{
      const im=await cargarImagen(ANIMAL_IMG[zodiaco.animal]);
      const off=document.createElement("canvas"); off.width=W; off.height=bgH;
      const octx=off.getContext("2d");
      const esc2=Math.max(W/im.width,bgH/im.height);
      const iw=im.width*esc2, ih=im.height*esc2;
      // Anclado arriba (no centrado): estas ilustraciones tienen la cabeza del animal en el tercio
      // superior y la parte de abajo vacía, así que un recorte centrado le cortaba la cabeza.
      octx.drawImage(im,(W-iw)/2,0,iw,ih);
      const mg=octx.createLinearGradient(0,0,0,bgH);
      mg.addColorStop(0,"rgba(0,0,0,1)"); mg.addColorStop(.72,"rgba(0,0,0,1)");
      mg.addColorStop(.86,"rgba(0,0,0,.5)"); mg.addColorStop(1,"rgba(0,0,0,0)");
      octx.globalCompositeOperation="destination-in"; octx.fillStyle=mg; octx.fillRect(0,0,W,bgH);
      ctx.drawImage(off,0,0);
    }catch(e){}
  }
  // velo oscuro arriba, para legibilidad del encabezado
  const vg=ctx.createLinearGradient(0,0,0,Math.round(H*.17));
  vg.addColorStop(0,"rgba(14,5,6,.85)"); vg.addColorStop(.53,"rgba(14,5,6,.55)"); vg.addColorStop(1,"rgba(14,5,6,0)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,Math.round(H*.17));
  ctx.shadowColor="rgba(0,0,0,.85)"; ctx.shadowBlur=14;
  // encabezado
  ctx.textBaseline="alphabetic"; ctx.textAlign="left";
  ctx.font="800 32px Montserrat, sans-serif"; ctx.fillStyle="#F5F1E8";
  ctx.fillText("QUANTUM",92,118);
  const wQ=ctx.measureText("QUANTUM ").width;
  ctx.fillStyle="#D4AF78"; ctx.fillText("BRANDING",92+wQ,118);
  function envolver(texto,maxW){
    const palabras=texto.split(" "); let linea="", lineas=[];
    for(const p of palabras){ const prueba=linea?linea+" "+p:p; if(ctx.measureText(prueba).width>maxW && linea){ lineas.push(linea); linea=p; } else linea=prueba; }
    if(linea) lineas.push(linea);
    return lineas;
  }
  // bloque inferior: etiqueta, nombre, animal, esencia, pie
  let y=Math.round(H*.58);
  ctx.font="500 29px Montserrat, sans-serif"; ctx.fillStyle="#F5F1E8";
  ctx.fillText("MI ARQUETIPO DE MARCA",76,y); y+=110;
  ctx.font="800 104px Montserrat, sans-serif"; ctx.fillStyle="#F5F1E8";
  const lineasNom=envolver(nom.toUpperCase(),W-152).slice(0,2);
  lineasNom.forEach(l=>{ ctx.fillText(l,76,y); y+=100; });
  y+=20;
  if(zodiaco){
    ctx.font="700 38px Montserrat, sans-serif";
    const txtAnimal=zodiaco.animal+" de "+zodiaco.elemento;
    const lblW=ctx.measureText("Mi animal  ").width, aniW=ctx.measureText(txtAnimal).width;
    ctx.font="500 23px Montserrat, sans-serif"; const lblWreal=ctx.measureText("MI ANIMAL").width;
    const padX=30,padY=16,gap=20, boxW=padX*2+lblWreal+gap+aniW, boxH=76;
    ctx.shadowBlur=0;
    ctx.fillStyle="rgba(14,5,6,.5)"; ctx.strokeStyle="rgba(212,175,120,.7)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(76,y-boxH+18,boxW,boxH,999); ctx.fill(); ctx.stroke();
    ctx.shadowColor="rgba(0,0,0,.85)"; ctx.shadowBlur=14;
    ctx.font="500 23px Montserrat, sans-serif"; ctx.fillStyle="#D4AF78";
    ctx.fillText("MI ANIMAL",76+padX,y-boxH/2+28);
    ctx.font="700 38px Montserrat, sans-serif"; ctx.fillStyle="#F5F1E8";
    ctx.fillText(txtAnimal,76+padX+lblWreal+gap,y-boxH/2+32);
    y+=68;
  }
  ctx.font="300 40px Montserrat, sans-serif"; ctx.fillStyle="#F5F1E8";
  const lineasEse=envolver(ese,W-152).slice(0,4);
  lineasEse.forEach(l=>{ ctx.fillText(l,76,y); y+=52; });
  // pie
  y+=30;
  ctx.shadowBlur=0;
  ctx.strokeStyle="rgba(212,175,120,.5)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(76,y); ctx.lineTo(W-76,y); ctx.stroke();
  y+=56;
  ctx.font="800 54px Montserrat, sans-serif"; ctx.fillStyle="#D4AF78";
  ctx.fillText("¿CUÁL ES EL TUYO?",76,y); y+=46;
  ctx.font="500 36px Montserrat, sans-serif"; ctx.fillStyle="#F5F1E8";
  ctx.fillText("quiz.quantumbranding.iprosper28.com",76,y); y+=42;
  ctx.font="400 32px Montserrat, sans-serif"; ctx.fillStyle="#BFB3A6";
  ctx.fillText(CONFIG.instagram,76,y);
  ctx.shadowBlur=0;
  return cv;
}
async function descargarTarjetaPNG(){
  try{ if(document.fonts&&document.fonts.load){ await Promise.all(["800 88px Montserrat","700 26px Montserrat","400 32px Montserrat"].map(f=>document.fonts.load(f).catch(()=>{}))); await document.fonts.ready; } }catch(e){}
  const cv=await dibujarTarjetaCanvas();

      const url=URL.createObjectURL(blob);

    },"image/png");

}

    reg=TZ_REG[tz]||null;
    if(!reg && tz.startsWith("America/Argentina")) reg="AR";
    if(!reg && /^America\/(Mexico_City|Monterrey|Cancun|Merida|Chihuahua|Tijuana|Mazatlan|Hermosillo|Matamoros|Bahia_Banderas|Ciudad_Juarez|Ojinaga)/.test(tz)) reg="MX";
  }catch(e){}
  if(!reg){ for(const l of (navigator.languages||[navigator.language||""])){ const m=/-([A-Z]{2})$/i.exec(l||""); if(m && REG_CUR[m[1].toUpperCase()]){ reg=m[1].toUpperCase(); break; } } }
  return reg;
}
function paisLocal(){ const r=regionLocal(); return r?[nombrePais(r),REG_CUR[r],r]:null; }
function fmtMoneda(n,cur){
  if(cur==="BOB") return "Bs "+Math.round(n).toLocaleString("es-BO");
  try{ return new Intl.NumberFormat("es",{style:"currency",currency:cur,maximumFractionDigits:0}).format(n); }catch(e){ return cur+" "+Math.round(n); }
}
async function tipoCambio(cur){
  if(TIPO_FIJO[cur]) return TIPO_FIJO[cur];
  try{ const c=JSON.parse(sessionStorage.getItem("qb-fx")||"null"); if(c&&c.rates&&Date.now()-c.t<864e5&&c.rates[cur]) return c.rates[cur]; }catch(e){}
  try{ const r=await fetch("https://open.er-api.com/v6/latest/USD"); const j=await r.json(); if(j&&j.rates){ try{sessionStorage.setItem("qb-fx",JSON.stringify({t:Date.now(),rates:j.rates}));}catch(e){} return j.rates[cur]||null; } }catch(e){}
  return null;
}
const PRIORIDAD=["BO","MX","US","ES","CO","PE","CL","AR","EC","AE"];
const PAISES_CALC=(()=>{ const todos=Object.keys(REG_CUR).map(r=>[nombrePais(r),REG_CUR[r],r]); const top=PRIORIDAD.map(r=>todos.find(x=>x[2]===r)); const resto=todos.filter(x=>!PRIORIDAD.includes(x[2])).sort((a,b)=>a[0].localeCompare(b[0],"es")); return [...top,...resto,["Otro país","USD","XX"]]; })();
function reducirImagenB64(file){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ const k=Math.min(1,1200/Math.max(im.width,im.height)), c=document.createElement("canvas");
      c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg",0.8)); };
    im.onerror=()=>{ URL.revokeObjectURL(url); no(new Error("imagen")); };
    im.src=url;
  });
}
async function precioLocal(el,usd,prod,cuotas,tipo){
  prod=prod||"el Diagnóstico de Identidad"; const cq=cuotas?cuotas.split("x").map(Number):null;
  tipo=tipo||(usd>=500?"auditoria":usd<=30?"mini":"diagnostico");
  if(!el) return;
  const pl=paisLocal(); const ini=pl?Math.max(0,PAISES_CALC.findIndex(x=>x[2]===pl[2])):PAISES_CALC.length-1;
  const uid="qr"+Math.random().toString(36).slice(2,9);
  el.innerHTML=`<div class="ccalc"><div class="cm-top"><span>Calcula en tu moneda</span><select aria-label="Tu país">${PAISES_CALC.map((x,k)=>`<option value="${k}"${k===ini?" selected":""}>${esc(x[0])}</option>`).join("")}</select></div><div class="cm-monto" aria-live="polite">—</div><div class="cm-nota"></div><div class="qr-bo" id="${uid}" hidden></div></div>`;
  el.hidden=false;
  const sel=el.querySelector("select"), monto=el.querySelector(".cm-monto"), nota=el.querySelector(".cm-nota"), caja=el.querySelector("#"+uid);
  async function pintar(){
    const [pais,cur]=PAISES_CALC[+sel.value];
    const extra=(fx,c)=> cq ? `<span class="cm-cuotas">o ${cq[0]} cuotas de ${c==="USD"?"USD "+cq[1]:fmtMoneda(cq[1]*fx,c)}</span>` : "";
    let montoBOB="";
    if(cur==="USD"){ monto.innerHTML=`USD ${usd}${extra(1,"USD")}`; nota.innerHTML="Pagas en dólares, sin conversión."; }
    else{
      monto.innerHTML=`<small>≈</small> …`;
      const fx=await tipoCambio(cur);
      if(!fx){ monto.innerHTML=`USD ${usd}`; nota.innerHTML="No pudimos cargar el tipo de cambio. Tu banco hace la conversión."; }
      else{ montoBOB=cur==="BOB"?fmtMoneda(usd*fx,cur):""; monto.innerHTML=`<small>≈</small> ${fmtMoneda(usd*fx,cur)}${extra(fx,cur)}`; nota.innerHTML= cur==="BOB" ? "Tipo de cambio 11 Bs por dólar." : "Tipo de cambio de hoy. Tu banco hace la conversión al pagar."; }
    }
    caja.hidden=cur!=="BOB";
    if(cur==="BOB" && !caja.dataset.ok){
      caja.dataset.ok="1";
      const wa="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent("Hola Ana, pagué "+prod+" por QR. Te mando el comprobante.");
      caja.innerHTML=`<img src="/img/qr-bcp.jpg" alt="QR de pago, Banco de Crédito BCP, Quantum Branding" class="qr-img" loading="lazy">
        <p class="qr-ayuda">Escanea desde tu banco e ingresa ${montoBOB||"el monto en bolivianos"}.</p>
        <label class="qr-correo-lbl"><small>Tu correo (para avisarte apenas se confirme)</small><input type="email" class="qr-correo" placeholder="tu@correo.com" value="${esc(S.email||"")}"></label>
        <label class="subir-cap"><b>Ya pagué por QR</b><small>Sube tu comprobante de pago</small><input type="file" accept="image/*" class="qr-file"></label>
        <p class="error qr-err" hidden></p>
        <button class="btn full qr-btn" type="button" disabled>Enviar comprobante</button>
        <p class="nota qr-estado" hidden></p>
        <a class="btn full qr-wa" href="${esc(wa)}" target="_blank" rel="noopener" hidden>Hablar con Ana por WhatsApp</a>`;
      const file=caja.querySelector(".qr-file"), btn=caja.querySelector(".qr-btn"), err=caja.querySelector(".qr-err"), estado=caja.querySelector(".qr-estado"), correo=caja.querySelector(".qr-correo"), waBtn=caja.querySelector(".qr-wa");
      file.addEventListener("change",()=>{ btn.disabled=!file.files.length; err.hidden=true; });
      btn.addEventListener("click",async ()=>{
        if(!file.files.length) return;
        btn.disabled=true; btn.textContent="Enviando…"; err.hidden=true;
        if(correo.value.trim()) S.email=correo.value.trim();
        let imagen=null;
        try{ imagen=await reducirImagenB64(file.files[0]); }catch(e){}
        try{
          await fetch("/api/qr",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
            tipo, nombre:S.nombre||"", email:correo.value.trim()||S.email||"", telefono:S.telnum||"",
            monto:montoBOB||("USD "+usd), ref:S.real?refMini():"", imagen:imagen?{base64:imagen}:null
          })}).catch(()=>{});
        }catch(e){}
        btn.textContent="Enviado ✓"; btn.hidden=true;
        file.closest("label.subir-cap").hidden=true; correo.closest("label.qr-correo-lbl").hidden=true;
        estado.textContent="Listo. Ana revisa tu comprobante y te confirma. Reenvíale la captura por WhatsApp por si acaso:";
        estado.hidden=false;
        waBtn.hidden=false;
        try{ window.open(wa,"_blank","noopener"); }catch(e){}
      });
    }
  }
  sel.addEventListener("change",pintar); pintar();
}

/* Calculadoras de moneda dentro de las pantallas (data-calc) */
new MutationObserver(()=>{ document.querySelectorAll("#app .pago-local[data-calc]:not([data-ok])").forEach(el=>{ el.dataset.ok="1"; precioLocal(el, +el.dataset.calc, el.dataset.prod, el.dataset.cuotas); }); }).observe(document.getElementById("app"),{childList:true,subtree:true});

/* Regreso de Stripe tras pagar el Mini: muestra el enlace directo apenas esté listo (normalmente en segundos),
   con el correo como respaldo si tarda más. */
(function(){ try{ const q=new URLSearchParams(location.search); if(q.get("mini")!=="ok") return;
  let email=""; try{ const av=leerAvance(); email=(av&&av.email)||S.email||""; }catch(e){}
  const c=document.createElement("div"); c.className="pago-capa";
  const pintar=(link)=>{
    c.innerHTML = link
      ? `<div class="pago-caja" style="height:auto;padding:28px 22px;gap:14px;text-align:center"><span class="kicker">Pago confirmado</span><h2 style="margin:0">Tu Mini Diagnóstico está listo.</h2><p>También te lo mandamos a tu correo por si lo quieres guardar.</p><a class="btn full" href="${esc(link)}">Ver mi Mini Diagnóstico</a><button class="btn sec full" type="button">Cerrar</button></div>`
      : `<div class="pago-caja" style="height:auto;padding:28px 22px;gap:14px;text-align:center"><span class="kicker">Pago confirmado</span><h2 style="margin:0">Preparando tu Mini Diagnóstico…</h2><p>Esto toma unos segundos. En cuanto esté listo aparece aquí el botón, y también te llega a tu correo.</p><button class="btn sec full" type="button">Cerrar</button></div>`;
    c.querySelector("button").onclick=()=>{ c.remove(); history.replaceState(null,"",location.pathname); };
  };
  pintar("");
  document.body.appendChild(c);
  if(email){
    let intentos=0;
    const poll=async()=>{
      intentos++;
      try{
        const r=await fetch("/api/mini-estado?email="+encodeURIComponent(email));
        const j=await r.json();
        if(j&&j.ok&&j.link){ pintar(j.link); return; }
      }catch(e){}
      if(intentos<10 && document.body.contains(c)) setTimeout(poll,1500);
    };
    setTimeout(poll,1200);
  }
}catch(e){} })();
</script>
